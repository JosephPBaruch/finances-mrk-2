services:
  data-permissions:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 1654:1654 /data && chmod 770 /data"]
    volumes:
      - finance-data:/data
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Plaid__ClientId: ${PLAID_CLIENT_ID:-}
      Plaid__Secret: ${PLAID_SECRET:-}
      Plaid__Environment: ${PLAID_ENVIRONMENT:-sandbox}
      Plaid__RedirectUri: ${PLAID_REDIRECT_URI:-}
      Encryption__Key: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a Base64-encoded 32-byte key}
    volumes:
      - finance-data:/data
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./src/FinanceApp.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_PLAID_CONNECTION_MODE: ${VITE_PLAID_CONNECTION_MODE:-both}
    depends_on:
      - api
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    restart: unless-stopped

volumes:
  finance-data:
